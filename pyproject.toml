[project]
name = "mlops-practitioner"
version = "0.1.0"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.0",
    "uvicorn>=0.52.4",
]


[project.optional-dependencies]
dev = ["pytest","pytest-cov","ruff","black","mypy","httpx","pre-commit"]

[tool.mypy]
ignore_missing_imports = true

[project.scripts]
mlops-practitioner-train = "mlops_practitioner.pipeline:run"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

